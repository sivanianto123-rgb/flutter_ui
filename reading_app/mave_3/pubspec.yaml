name: mave_3
description: "Mave - A phoneme learning app for toddlers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Game engine
  flame: ^1.18.0
  flame_riverpod: ^5.0.0+1

  # Audio
  just_audio: ^0.9.37

  # Animations
  flutter_animate: ^4.5.0

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Speech recognition / microphone amplitude
  speech_to_text: ^7.0.0
  noise_meter: ^5.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

  # Networking
  http: ^1.2.1

  # Utils
  path_provider: ^2.1.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
